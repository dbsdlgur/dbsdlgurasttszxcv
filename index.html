<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>학습자료</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f5f0;color:#20382e;font:15px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}#lockPanel{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #d9dfd7;border-radius:16px;padding:32px;box-shadow:0 8px 32px #20382e0a}h1{font-size:25px;margin:0 0 12px}p{line-height:1.7;color:#657367}label{display:block;font-size:14px;margin-top:22px}input{width:100%;padding:12px;margin:8px 0 16px;font:inherit;border:1px solid #c8d2c9;border-radius:8px}button{padding:10px 14px;font:inherit;border:1px solid #c8d2c9;background:white;color:#20382e;border-radius:8px;cursor:pointer}button.primary{background:#286b53;border-color:#286b53;color:white}button:disabled{opacity:.5;cursor:wait}.wide{width:100%}.small{font-size:13px}header{padding:12px 20px;background:#fff;border-bottom:1px solid #d9dfd7}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row strong{margin-right:auto;font-size:18px}#status{font-size:13px;min-height:20px;margin-top:8px}#viewer{display:block;border:0;width:100%;height:100dvh;min-height:0}dialog{width:min(92vw,480px);padding:28px;border:1px solid #ccc;border-radius:12px}dialog::backdrop{background:#10241bb3}#unlockStatus{min-height:20px;color:#a32626;margin-top:12px;font-size:13px}@media(max-width:640px){header{padding:10px}.row strong{width:100%}.card{padding:25px}button{font-size:13px}}
</style></head><body><section id="lockPanel"><div class="card"><h1>학습자료</h1><p>비밀번호를 입력해 내용을 확인하세요.</p><form id="unlockForm"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock" class="primary wide">열기</button><div id="unlockStatus" role="status" aria-live="polite"></div></form></div></section><section id="workspace" hidden><iframe id="viewer" title="자산내역 편집 화면"></iframe></section><dialog id="githubAuth"><form method="dialog"><h2>GitHub 저장 연결</h2><p class="small">저장할 때만 dbsdlgur/dbsdlgurasttszxcv 저장소의 Contents 읽기·쓰기 권한이 있는 토큰이 필요합니다. 최초 한 번 입력하면 토큰을 비밀번호로 암호화해 파일에 보관합니다. 비밀번호를 아는 사람은 저장소를 수정할 수 있습니다.</p><label for="githubToken">GitHub 토큰</label><input id="githubToken" type="password" autocomplete="off"><div class="row"><button value="cancel">취소</button><button value="connect" class="primary">연결</button></div></form></dialog><script>function bytes64(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
function unbase64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function passwordKey(password,salt,iterations=600000){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unbase64(salt),iterations},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptHTML(html,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(html));return {version:1,kdf:'PBKDF2-SHA256',iterations:600000,salt,iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function encryptToken(token,key){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(token));return {iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function decryptToken(value,key){const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(value.iv)},key,unbase64(value.data));return new TextDecoder().decode(data)}
async function decryptHTML(payload,key){if(payload.version!==1||payload.kdf!=='PBKDF2-SHA256'||payload.iterations!==600000)throw Error('지원하지 않는 파일 형식입니다.');const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(payload.iv)},key,unbase64(payload.data));return new TextDecoder().decode(data)}

(()=>{
 const $=id=>document.getElementById(id),frame=$('viewer'),BASE='https://api.github.com/repos/dbsdlgur/dbsdlgurasttszxcv/contents/';
 let payload=null,key=null,token='',dirty=false,busy=false,revision=0,rendering=false,notice='',noticeError=false;
 function show(text,error=false){notice=text;noticeError=error;const el=frame.contentDocument?.getElementById('githubSaveStatus');if(el){el.textContent=text;el.style.color=error?'#a32626':'#486250';el.hidden=!text}}
 function changed(){if(rendering)return;dirty=true;revision++;show('변경값이 있습니다. 저장을 눌러 GitHub에 반영하세요.')}
 function bindViewer(){const doc=frame.contentDocument,old=doc.getElementById('exportHtmlBtn');if(old){const button=old.cloneNode(true);button.disabled=busy;button.textContent=busy?'저장 중…':'저장';old.replaceWith(button);button.addEventListener('click',()=>save())}let el=doc.getElementById('githubSaveStatus');if(!el){el=doc.createElement('div');el.id='githubSaveStatus';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.style.cssText='margin:0 0 14px;font-size:14px';const top=doc.querySelector('main > .top');if(top)top.after(el);else doc.body.prepend(el)}show(notice,noticeError)}
 function view(html){rendering=true;frame.name='estate-cloud:protected-assets';frame.onload=()=>{rendering=false;dirty=false;revision++;bindViewer()};frame.srcdoc=html;$('lockPanel').hidden=true;$('workspace').hidden=false}
 function inner(){const api=frame.contentWindow?.estateFileApi;if(!api)throw Error('화면을 불러오는 중입니다. 잠시 후 다시 시도하세요.');return api}
 async function credentials(){if(token)return;const dialog=$('githubAuth');$('githubToken').value='';dialog.showModal();await new Promise((resolve,reject)=>dialog.addEventListener('close',()=>{const value=$('githubToken').value.trim();$('githubToken').value='';if(dialog.returnValue==='connect'&&value){token=value;resolve()}else reject(Error('GitHub 연결을 취소했습니다.'))},{once:true}))}
 async function request(path,options={}){const r=await fetch(BASE+path+(options.method?'':'?ref=master&t='+Date.now()),{...options,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(token?{Authorization:'Bearer '+token}:{}),...options.headers},cache:'no-store',credentials:'omit'});if(!r.ok){if(r.status===401){token='';throw Error('GitHub 토큰을 다시 입력해 주세요.')}if(r.status===409||r.status===422)throw Error('다른 곳에서 수정되었습니다. 현재 변경값을 별도로 보관한 뒤 페이지를 새로 열어주세요.');throw Error(r.status===403?'저장소의 Contents 쓰기 권한과 GitHub 요청 한도를 확인하세요.':'GitHub 요청 실패 ('+r.status+')')}return r}
 async function latestData(){const meta=await(await request('data.enc.json')).json();if(meta.encoding!=='base64'||!meta.content)throw Error('데이터 파일을 읽지 못했습니다.');return {sha:meta.sha,payload:JSON.parse(new TextDecoder().decode(unbase64(meta.content.replace(/\s/g,''))))}}
 async function readTemplate(){const r=await request('template.enc.json',{headers:{Accept:'application/vnd.github.raw+json'}});return r.json()}
 function extractState(html){const doc=new DOMParser().parseFromString(html,'text/html'),data=doc.getElementById('estateData'),table=doc.getElementById('recordsTable'),date=doc.getElementById('dataDateNotice');if(!data||!table||!date)throw Error('저장할 자산 정보를 찾지 못했습니다.');return {estateData:data.textContent,recordsTable:table.outerHTML,dataDateNotice:date.textContent}}
 function restoreState(template,state){const doc=new DOMParser().parseFromString(template,'text/html'),data=doc.getElementById('estateData'),table=doc.getElementById('recordsTable'),date=doc.getElementById('dataDateNotice');if(!data||!table||!date||typeof state.estateData!=='string'||typeof state.recordsTable!=='string')throw Error('저장된 자산 정보 형식이 올바르지 않습니다.');JSON.parse(state.estateData);data.textContent=state.estateData;const parsed=new DOMParser().parseFromString(state.recordsTable,'text/html'),replacement=parsed.getElementById('recordsTable');if(!replacement)throw Error('대조표를 불러오지 못했습니다.');table.replaceWith(replacement);date.textContent=state.dataDateNotice||'';return '<!doctype html>\n'+doc.documentElement.outerHTML}
 function saveBusy(value){const button=frame.contentDocument?.getElementById('exportHtmlBtn');if(button){button.disabled=value;button.textContent=value?'저장 중…':'저장'}}
 async function run(fn){if(busy)return;busy=true;saveBusy(true);try{await fn()}catch(e){show(e.message,true)}finally{busy=false;saveBusy(false)}}
 async function save(){return run(async()=>{if(!key)throw Error('비밀번호로 잠금을 먼저 해제하세요.');await credentials();show('GitHub 최신 데이터 확인 중…');const current=await latestData();if(JSON.stringify(current.payload)!==JSON.stringify(payload))throw Error('다른 곳에서 수정되었습니다. 현재 변경값을 별도로 보관한 뒤 페이지를 새로 열어주세요.');const snapshot=extractState(inner().serialize().html),atRevision=revision;show('변경값을 암호화해 저장 중…');const next=await encryptHTML(JSON.stringify(snapshot),key,payload.salt);next.githubToken=await encryptToken(token,key);await(await request('data.enc.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Update encrypted asset data',branch:'master',sha:current.sha,content:bytes64(new TextEncoder().encode(JSON.stringify(next)))})})).json();payload=next;dirty=revision!==atRevision;show(dirty?'저장 완료 · 저장 중 입력한 값은 한 번 더 저장하세요.':'저장 완료 · 다른 기기에서도 최신 값으로 열립니다.')})}
 $('unlockForm').onsubmit=async e=>{e.preventDefault();const button=$('unlock');button.disabled=true;$('unlockStatus').textContent='최신 데이터를 불러오고 있습니다…';try{const [current,template]=await Promise.all([latestData(),readTemplate()]);const candidate=await passwordKey($('password').value,current.payload.salt,current.payload.iterations);const [plain,stateText]=await Promise.all([decryptHTML(template,candidate),decryptHTML(current.payload,candidate)]);const savedToken=current.payload.githubToken?await decryptToken(current.payload.githubToken,candidate):'';const html=restoreState(plain,JSON.parse(stateText));payload=current.payload;key=candidate;token=savedToken;$('password').value='';view(html);show('')}catch(error){key=null;$('password').value='';$('unlockStatus').textContent=error.name==='OperationError'?'비밀번호가 맞지 않거나 파일이 손상되었습니다.':(error.message||'데이터를 불러오지 못했습니다.')}finally{button.disabled=false}};
 window.estateCloudHost={save,changed};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></body></html>
